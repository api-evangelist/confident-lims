aid: confident-lims
name: Confident LIMS
description: >-
  Confident LIMS (CC Software LLC, formerly Confident Cannabis, founded 2015) is a cloud-based
  Laboratory Information Management System for high-velocity analytical testing labs and their
  testing clients. It manages samples from accession through workflow, results, and reporting,
  automates regulatory compliance (ISO 17025, TNI/NELAP, SOC 2, FDA 21 CFR Part 11), and gives
  clients a self-service ordering and results portal. It serves cannabis, food & beverage,
  agriculture, nutraceuticals, cosmetics, environmental, industrial chemicals, and oil & gas
  labs. The Confident Cannabis REST API (v0, api.confidentcannabis.com) exposes labs, clients,
  and shared reference data with API-key + HMAC-SHA256 request signing and result webhooks.
