              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF file
      responses:
        '200':
          description: Successful upload
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - coa_url
                properties:
                  success:
                    type: boolean
                    example: true
                  coa_url:
                    type: string
                    format: uri
                    example: https://cdn.confidentcannabis.com/coa/sample123.pdf
        '400':
          description: Invalid request
          content:
