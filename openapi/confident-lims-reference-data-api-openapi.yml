openapi: 3.1.0
info:
  title: Clients Client Info Reference Data API
  version: 0.16.0
  description: API endpoints for clients to view their orders, samples, and associated labs. All endpoints are read-only (GET) and accessible only with client API credentials.
  contact:
    name: Confident Cannabis API Support
    url: https://www.confidentcannabis.com
servers:
- url: https://api.confidentcannabis.com
  description: Production server
security:
- ApiKeyAuth: []
tags:
- name: Reference Data
  description: Reference data for sample metadata
paths:
  /v0/clients/sampletypes:
    get:
      summary: Get all sample types
      description: Returns a list of all sample types (hidden from public documentation).
      operationId: getClientSampleTypes
      tags:
      - Reference Data
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: Successful response with list of sample types
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - sample_types
                properties:
                  success:
                    type: boolean
                    example: true
                  sample_types:
                    type: array
                    items:
                      type: object
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                type: object
                description: Error response
                required:
                - success
                - error_code
                - error_message
                properties:
                  success:
                    type: boolean
                    example: false
                  error_code:
                    type: string
                    example: missing_api_key
                  error_message:
                    type: string
                    example: Missing API key header
                  error_details:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                type: object
                description: Error response
                required:
                - success
                - error_code
                - error_message
                properties:
                  success:
                    type: boolean
                    example: false
                  error_code:
                    type: string
                    example: permission_denied
                  error_message:
                    type: string
                    example: Access denied
                  error_details:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
