  /v0/labs/order:
    post:
      summary: Create order
      description: Creates a new order with one or more samples.
      operationId: createOrder
      tags:
      - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - client_id
              - lab_internal_id
              - samples
              properties:
                client_id:
                  type: integer
                  description: Client ID
                lab_internal_id:
                  type: string
                  description: Lab's internal order ID
                samples:
                  type: array
                  description: Array of samples to include in order
                  minItems: 1
                  items:
                    type: object
                    required:
                    - name
                    - sample_type_id
                    - lab_internal_id
                    properties:
                      name:
                        type: string
                      sample_type_id:
                        type: integer
                      lab_internal_id:
                        type: string
                      strain:
                        type: string
                      regulator_batch_id:
                        type: string
                      harvest_id:
                        type: string
            examples:
              single_sample:
                summary: Order with one sample
                value:
                  client_id: 123
                  lab_internal_id: ORD-2025-100
                  samples:
                  - name: OG Kush - Batch 42
                    sample_type_id: 1
                    lab_internal_id: SAMP-2025-100
                    regulator_batch_id: BATCH-42
      responses:
